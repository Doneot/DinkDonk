name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run coverage
      - run: npm run build

      # Blocking, but only for advisories not explicitly allowlisted:
      # firebase-admin's dependency chain currently carries one known,
      # tracked transitive vulnerability with no non-major fix available -
      # see scripts/check-audit-allowlist.mjs for that specific exception.
      # A brand new high/critical advisory in any other dependency still
      # fails the build, unlike a blanket `npm audit ... || true`.
      - name: npm audit (allowlisted exceptions only)
        run: npm run audit:check

      - name: Docker build smoke test
        working-directory: .
        run: docker build -f server/Dockerfile.prod server

  client:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Docker build smoke test
        working-directory: .
        run: docker build -f deploy/Dockerfile.caddy .
