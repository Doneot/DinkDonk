name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run coverage
      - run: npm run build

      # Non-blocking: firebase-admin's dependency chain currently carries a
      # known, tracked transitive vulnerability with no fix available yet.
      # This still surfaces new high-severity issues in the job log without
      # turning CI red for the one that's already known.
      - name: npm audit (non-blocking)
        run: npm audit --omit=dev --audit-level=high || true

      - name: Docker build smoke test
        working-directory: .
        run: docker build -f server/Dockerfile.prod server

  client:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
