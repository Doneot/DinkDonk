name: dinkdonk

# Docker's default json-file driver has no size cap on its own - without
# this, any service's logs can grow unbounded and fill the disk, undermining
# the resource budgeting below. Applied to every service via the anchor.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.caddy
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    # This whole stack shares a 6vCPU/12GB VPS with other, unrelated apps -
    # every service below gets an explicit ceiling so a runaway process here
    # can't starve either its own siblings or those other apps. Sized as a
    # deliberately conservative starting budget (see the summary at the
    # bottom of this file); memory is a hard cap (OOM-killed if exceeded),
    # cpus is a ceiling on burst, not a reservation, so idle capacity is
    # still available to the rest of the host.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    networks:
      - public
      - private

  backend:
    build:
      context: ../server
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    secrets:
      - firebase_service_account
      - discord_token
      - discord_client_secret
      - twitch_client_secret
      - twitch_webhook_secret
      - session_secret
      - encryption_key
      - metrics_token
    environment:
      NODE_ENV: production
      PORT: 3000
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_service_account
      # Backs the rate limiters and EventSub replay store so both survive a
      # restart and stay correct if this ever runs as more than one replica.
      # No auth: redis is only reachable over the private, internal-only
      # network below (same trust boundary as prometheus, further down).
      REDIS_URL: redis://redis:6379
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/health/ready'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    # The app's graceful-shutdown sequence (runtime disposal, then
    # sockets/Discord/Twitch teardown concurrently, then Firestore) can take
    # up to ~10s in its worst case; Compose's default 10s grace period would
    # SIGKILL it mid-teardown, so give it comfortable headroom.
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    networks:
      - public
      - private

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    # Rate-limit counters and EventSub replay dedup are both short-lived
    # (TTL-bound) and non-critical if lost - an appendonly volume would add
    # persistence for data that's explicitly designed not to need it, at the
    # cost of extra disk I/O on every write.
    # maxmemory is a safety net alongside that TTL-based design (a bug or an
    # attack generating keys faster than they expire shouldn't be able to
    # consume unbounded host memory); volatile-ttl evicts the
    # closest-to-expiring keys first, which fits data that's already meant
    # to be short-lived.
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "volatile-ttl",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    expose:
      - "6379"
    # Comfortably above the 256mb --maxmemory above: that flag bounds the
    # dataset itself, this bounds the whole redis-server process (dataset +
    # connection/client buffers + its own overhead).
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 320M
    networks:
      - private

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    logging: *default-logging
    # See compose.dev.yml for why this is warn rather than the default.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --log.level=warn
    secrets:
      - metrics_token
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
    networks:
      - private

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - prometheus
    secrets:
      - grafana_admin_password
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      # See compose.dev.yml for why this is error rather than the default.
      GF_LOG_LEVEL: error
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/assets/user_profile.png:/usr/share/grafana/public/img/user_profile.png:ro
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
    networks:
      - private

# Resource budget for this stack (see each service's `deploy.resources.limits`
# above): caddy 0.5 CPU/128M + backend 1.0 CPU/768M + redis 0.5 CPU/320M +
# prometheus 0.75 CPU/768M + grafana 0.5 CPU/384M = 3.25 CPU / ~2.3GB ceiling.
# Deliberately well under the VPS's 6 vCPU / 12GB total, leaving room for
# compose.staging.yml's stack (if co-located on the same host) plus whatever
# unrelated apps also run there. `cpus` is a burst ceiling, not a
# reservation - idle capacity is still available to the rest of the host;
# `memory` is a hard cap, so these are intentionally generous rather than
# tight. Revisit with real numbers from Grafana/`docker stats` once this has
# run under production load for a while.
volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:

networks:
  public:
  private:
    internal: true

secrets:
  firebase_service_account:
    file: ./secrets/firebase-service-account.json
  discord_token:
    file: ./secrets/discord-token
  discord_client_secret:
    file: ./secrets/discord-client-secret
  twitch_client_secret:
    file: ./secrets/twitch-client-secret
  twitch_webhook_secret:
    file: ./secrets/twitch-webhook-secret
  session_secret:
    file: ./secrets/session-secret
  encryption_key:
    file: ./secrets/encryption-key
  metrics_token:
    file: ./secrets/metrics-token
  grafana_admin_password:
    file: ./secrets/grafana-admin-password
