services:
  ngrok:
    image: ngrok/ngrok:latest
    command: http backend:3000
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"

  backend:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    user: root
    working_dir: /app
    env_file:
      - ../server/.env.development
    environment:
      NODE_ENV: development
      PORT: 3000
      NGROK_API_URL: http://ngrok:4040/api/tunnels
    volumes:
      - ../server:/app
      - /app/node_modules
    command: npm run dev:ngrok
    ports:
      - "3000:3000"
    depends_on:
      - ngrok
    stop_grace_period: 30s
