services:
  backend:
    build:
      context: ../server
      dockerfile: ../server/Dockerfile.dev
    restart: unless-stopped
    user: root
    working_dir: /app
    env_file:
      - ../server/.env.development
    environment:
      NODE_ENV: development
      PORT: 3000
    volumes:
      - ../server:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    stop_grace_period: 30s

volumes:
  node_modules:
