services:
  backend:
    build:
      context: ../server
      dockerfile: ../server/Dockerfile.dev
    restart: unless-stopped
    user: root
    working_dir: /app
    env_file:
      - ../server/.env.development
    environment:
      NODE_ENV: development
      PORT: 3000
    volumes:
      - ../server:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    stop_grace_period: 30s

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    # Default (info) logging repeats the full startup/TSDB-replay/compaction
    # sequence on every restart; warn keeps that quiet while still surfacing
    # anything actually wrong (failed scrapes, config reload errors, etc.).
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --log.level=warn
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      # Local-only demo credentials; production uses a Docker secret instead
      # (see compose.prod.yml).
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Default (info) logging replays Grafana's entire migration/plugin-scan
      # history on every startup, and this image ships several bundled
      # datasource plugin.json files that fail to parse (warn-level noise,
      # unrelated to our config). Malformed provisioning files are silently
      # skipped by Grafana regardless of log level, so error doesn't hide
      # anything actionable - it just drops the built-in image noise.
      GF_LOG_LEVEL: error
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      # The image references this default avatar but doesn't actually ship
      # it, logging an error on every request that falls back to it.
      - ./monitoring/grafana/assets/user_profile.png:/usr/share/grafana/public/img/user_profile.png:ro
    ports:
      - "3001:3000"

volumes:
  node_modules:
  grafana_data:
