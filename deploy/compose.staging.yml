name: dinkdonk-staging

# Docker's default json-file driver has no size cap on its own - without
# this, any service's logs can grow unbounded and fill the disk. Applied to
# every service via the anchor.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.caddy
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - caddy_staging_data:/data
      - caddy_staging_config:/config
    # Lighter than compose.prod.yml's equivalent budget - staging is expected
    # to run alongside prod (and possibly other, unrelated apps) on the same
    # shared VPS. See the summary comment at the bottom of this file.
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    networks:
      - public
      - private

  backend:
    build:
      context: ../server
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.staging
    secrets:
      - firebase_service_account
      - discord_token
      - discord_client_secret
      - twitch_client_secret
      - twitch_webhook_secret
      - session_secret
      - encryption_key
      - metrics_token
    environment:
      NODE_ENV: production
      PORT: 3000
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_service_account
      REDIS_URL: redis://redis:6379
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/health/ready'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - public
      - private

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    # maxmemory is a safety net alongside the TTL-based data this instance
    # stores (rate-limit counters, EventSub replay dedup): volatile-ttl
    # evicts the closest-to-expiring keys first if a bug or an attack ever
    # generates keys faster than they expire.
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "volatile-ttl",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    expose:
      - "6379"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M
    networks:
      - private

# Resource budget for this stack: caddy 0.25 CPU/64M + backend 0.5 CPU/512M +
# redis 0.25 CPU/192M = 1.0 CPU / ~768M ceiling. Combined with
# compose.prod.yml's 3.25 CPU / ~2.3GB (if co-located on the same host),
# that's ~4.25 CPU / ~3GB for the whole DinkDonk stack against the VPS's
# 6 vCPU / 12GB, leaving headroom for other apps sharing the box. `cpus` is
# a burst ceiling, not a reservation. Revisit with real usage numbers once
# this has run for a while.
volumes:
  caddy_staging_data:
  caddy_staging_config:

networks:
  public:
  private:
    internal: true

secrets:
  firebase_service_account:
    file: ./secrets-staging/firebase-service-account.json
  discord_token:
    file: ./secrets-staging/discord-token
  discord_client_secret:
    file: ./secrets-staging/discord-client-secret
  twitch_client_secret:
    file: ./secrets-staging/twitch-client-secret
  twitch_webhook_secret:
    file: ./secrets-staging/twitch-webhook-secret
  session_secret:
    file: ./secrets-staging/session-secret
  encryption_key:
    file: ./secrets-staging/encryption-key
  metrics_token:
    file: ./secrets-staging/metrics-token
