name: dinkdonk-staging

services:
  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.caddy
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - caddy_staging_data:/data
      - caddy_staging_config:/config
    networks:
      - public
      - private

  backend:
    build:
      context: ../server
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.staging
    secrets:
      - firebase_service_account
      - discord_token
      - discord_client_secret
      - twitch_client_secret
      - twitch_webhook_secret
      - session_secret
      - encryption_key
      - metrics_token
    environment:
      NODE_ENV: production
      PORT: 3000
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_service_account
      REDIS_URL: redis://redis:6379
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/health/ready'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - public
      - private

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    expose:
      - "6379"
    networks:
      - private

volumes:
  caddy_staging_data:
  caddy_staging_config:

networks:
  public:
  private:
    internal: true

secrets:
  firebase_service_account:
    file: ./secrets-staging/firebase-service-account.json
  discord_token:
    file: ./secrets-staging/discord-token
  discord_client_secret:
    file: ./secrets-staging/discord-client-secret
  twitch_client_secret:
    file: ./secrets-staging/twitch-client-secret
  twitch_webhook_secret:
    file: ./secrets-staging/twitch-webhook-secret
  session_secret:
    file: ./secrets-staging/session-secret
  encryption_key:
    file: ./secrets-staging/encryption-key
  metrics_token:
    file: ./secrets-staging/metrics-token
