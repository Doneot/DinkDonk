name: DinkDonkAlarm

options:
  bundleIdPrefix: com.doneot
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    # DEVELOPMENT_TEAM intentionally not set here - it's tied to a personal
    # Apple ID/Team ID and shouldn't be committed. Set it locally in Xcode's
    # Signing & Capabilities tab (or `xcodebuild -allowProvisioningUpdates`,
    # which will prompt); re-run `xcodegen generate` before committing again
    # to strip it back out of project.pbxproj if Xcode writes it there.
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.0.0

targets:
  DinkDonkAlarm:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: DinkDonkAlarm
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doneot.dinkdonkalarm
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: SocketIO
        product: SocketIO
